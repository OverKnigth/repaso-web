<div class="container-fluid text-center">
    <br />
    <h1>Mis productos</h1>
    <h5>Aquí puedes ver todos los productos registrados, editarlos o eliminarlos.</h5>
    <br />
  
    <div class="d-flex justify-content-center align-content-center flex-wrap gap-5">
        @for (product of products; track $index) {
          <div class="card w-25">
            <div class="card-body">
              <h5 class="card-title">{{ product.name }}</h5>
              <p class="card-subtitle text-muted mb-2">Precio: ${{ product.price }}</p>
              <p class="card-text">{{ product.description }}</p>
              <div class="d-flex justify-content-center gap-3">
                <button class="btn btn-danger" (click)="eliminarProducto(product.id)">Eliminar</button>
                <button class="btn btn-warning" (click)="editarProducto(product.id)">Editar</button>
              </div>
            </div>
          </div>
        }
    </div>
  </div>
