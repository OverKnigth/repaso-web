<div class="container text-center">
    <h1>Cervezas API</h1>
    <div class="d-flex justify-content-center align-content-center flex-wrap gap-5">
        @for(cerveza of cervezas; track $index){
            <div class="card" style="width: 18rem;" (click)="verCerveza(cerveza.id)">
                <img 
                    [src]="cerveza.image" 
                    class="card-img-top p-3"
                    style="height: 200px; width: fit-content; max-width: 100%; margin-inline: auto;" 
                    [alt]="cerveza.name">
                <div class="card-body">
                    <h5 class="card-title">{{cerveza.name}}</h5>
                    <h6 class="card-subtitle mb-2">{{cerveza.price}}</h6>
                </div>
            </div>
        }
    </div>
</div>
